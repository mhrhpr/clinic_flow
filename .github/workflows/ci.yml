name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck web
        run: npm run typecheck

      - name: Lint web
        run: npm run lint

  contracts:
    name: Shared contracts validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install contract dependencies
        run: npm install

      - name: Typecheck contracts
        run: npm run typecheck

      - name: Test contracts
        run: npm test

      - name: Build contracts
        run: npm run build

  patient-service:
    name: Patient service validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/patient-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install service dependencies
        run: npm install

      - name: Typecheck service
        run: npm run typecheck

      - name: Test service
        run: npm test

      - name: Build service
        run: npm run build
