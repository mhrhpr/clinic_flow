name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck web
        run: npm run typecheck

      - name: Lint web
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/clinicflow-next.log 2>&1 &
          echo $! > /tmp/clinicflow-next.pid

      - name: Runtime smoke test
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/dashboard > /tmp/dashboard.html; then break; fi
            sleep 1
          done
          test -s /tmp/dashboard.html
          grep -q "ClinicFlow" /tmp/dashboard.html
          curl -fsS http://127.0.0.1:3100/api/demo/patients | grep -q '"data"'
          curl -fsS http://127.0.0.1:3100/api/demo/appointments | grep -q '"data"'

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/clinicflow-next.pid ]; then kill $(cat /tmp/clinicflow-next.pid) || true; fi
          if [ -f /tmp/clinicflow-next.log ]; then tail -n 80 /tmp/clinicflow-next.log; fi

  patient-service:
    name: Patient service validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/patient-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install service dependencies
        run: npm install

      - name: Typecheck service
        run: npm run typecheck

      - name: Test service
        run: npm test

      - name: Build service
        run: npm run build
